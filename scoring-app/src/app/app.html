<mat-toolbar color="primary" class="app-toolbar" *ngIf="utilisateurConnecte">
  <button mat-icon-button (click)="sidenavOpened = !sidenavOpened" aria-label="Toggle navigation">
    <mat-icon>menu</mat-icon>
  </button>
  <span class="toolbar-title">Scoring Résiliation</span>
  <span class="toolbar-spacer"></span>
  <span class="toolbar-user">{{ utilisateurConnecte.nom }}</span>
  <button mat-icon-button (click)="seDeconnecter()" aria-label="Se déconnecter" title="Se déconnecter">
    <mat-icon>logout</mat-icon>
  </button>
</mat-toolbar>

<!-- Bannière Modèle non disponible (10.4) -->
<div class="banniere-modele-indisponible" *ngIf="modeleIndisponible" role="alert">
  <mat-icon>warning</mat-icon>
  <span>Le modèle de scoring n'est pas disponible. Contactez l'administrateur.</span>
</div>

<!-- Bannière Service indisponible avec bouton Réessayer (10.3) -->
<div class="banniere-service-indisponible" *ngIf="serviceIndisponible && !modeleIndisponible" role="alert">
  <mat-icon>cloud_off</mat-icon>
  <span>Service indisponible. Vérifiez que le serveur est démarré.</span>
  <button mat-raised-button color="accent" (click)="reessayer()" class="btn-reessayer">
    <mat-icon>refresh</mat-icon>
    Réessayer
  </button>
</div>

<mat-sidenav-container class="sidenav-container" [class.has-banner]="banniereVisible" *ngIf="utilisateurConnecte; else pageSansNav">
  <mat-sidenav [opened]="sidenavOpened" mode="side" class="app-sidenav">
    <mat-nav-list>
      <a mat-list-item routerLink="/scoring" routerLinkActive="active-link">
        <mat-icon matListItemIcon>assessment</mat-icon>
        <span matListItemTitle>Scoring Contrat</span>
      </a>
      <a mat-list-item routerLink="/dashboard" routerLinkActive="active-link">
        <mat-icon matListItemIcon>dashboard</mat-icon>
        <span matListItemTitle>Dashboard</span>
      </a>
      <a mat-list-item routerLink="/batch" routerLinkActive="active-link">
        <mat-icon matListItemIcon>play_circle</mat-icon>
        <span matListItemTitle>Batch</span>
      </a>
      <a mat-list-item routerLink="/admin/users" routerLinkActive="active-link" *ngIf="estAdmin">
        <mat-icon matListItemIcon>manage_accounts</mat-icon>
        <span matListItemTitle>Utilisateurs</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="main-content">
    <router-outlet />
  </mat-sidenav-content>
</mat-sidenav-container>

<!-- Page login : pas de toolbar/sidenav -->
<ng-template #pageSansNav>
  <router-outlet />
</ng-template>
