# ============================================================
# SonarCloud — Configuration qualité
# ============================================================

# Clé unique du projet sur SonarCloud
sonar.projectKey=ShaimaNourddine_scoring-resiliation
sonar.projectName=Scoring Résiliation — PFE Masteri

# Organisation SonarCloud
sonar.organization=shaimanourddine

# Sources analysées
sonar.sources=.
sonar.inclusions=**/*.py,scoring-app/src/**/*.ts,scoring-app/src/**/*.html

# Exclusions
sonar.exclusions=\
  **/node_modules/**,\
  **/__pycache__/**,\
  **/dist/**,\
  **/tests/**,\
  k8s/**,\
  terraform/**,\
  **/*.spec.ts,\
  **/environments/**

# Rapport de couverture Python (généré par pytest --cov)
sonar.python.coverage.reportPaths=coverage-api.xml
sonar.python.version=3.11

# TypeScript
sonar.javascript.lcov.reportPaths=scoring-app/coverage/lcov.info

# Encodage
sonar.sourceEncoding=UTF-8

# Quality Gate
sonar.qualitygate.wait=true
